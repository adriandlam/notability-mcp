[project]
name = "notability-mcp"
version = "0.1.0"
description = "MCP server for searching and reading Notability notes, handwriting included"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Adrian Lam", email = "me@adrianlam.sh" }]
requires-python = ">=3.12"
keywords = ["mcp", "notability", "handwriting", "ocr"]
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "keyring>=25.7.0",
    "mcp>=2.3,<3",
    "pillow>=12",
    "pypdfium2>=5.14",
    "websockets>=17.3",
    # OCR: Apple's Vision on macOS, RapidOCR (ONNX models bundled in the wheel) elsewhere
    "pyobjc-framework-vision>=12 ; sys_platform == 'darwin'",
    "rapidocr>=3.10 ; sys_platform != 'darwin'",
    "onnxruntime>=1.20 ; sys_platform != 'darwin'",
]

[project.urls]
Repository = "https://github.com/adriandlam/notability-mcp"
Issues = "https://github.com/adriandlam/notability-mcp/issues"

[project.scripts]
notability-mcp = "notability_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["anyio>=4", "pyright>=1.1.400", "pytest>=9", "ruff>=0.16"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
