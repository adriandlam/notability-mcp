name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS: handwriting OCR uses Apple's Vision framework.
    runs-on: macos-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: make check
