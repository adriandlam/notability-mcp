name: Bug report
description: Something doesn't work
body:
  - type: markdown
    attributes:
      value: >-
        Don't paste your nb-auth-token, or anything from notes you want to keep private. Report
        security problems [privately](https://github.com/adriandlam/notability-mcp/security/advisories/new)
        instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command or prompt, what you expected, and the output or error you got.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 26, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Code, Claude Desktop, Cursor
